{{define "base"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Cadence Cards{{end}}</title>
  <link rel="icon" href="/static/favicon.svg?v={{.AssetVersion}}" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{.AssetVersion}}">
</head>
{{/* No white card — the reference puts the form straight onto the page
     background, centred in a max-w-md column. */}}
<body>
  <main class="auth-main">
    <div class="auth-col">
      {{template "content" .}}
    </div>
  </main>
</body>
</html>{{end}}
