{{define "title"}}New card — Cadence Cards{{end}}
{{define "content"}}
{{$d := .Data}}
{{$v := $d.Params}}
<div class="page-header">
  <a class="back-link" href="/cards">{{template "icon-arrow-left"}} Cards</a>
</div>
<div class="card form-card">
  <h1>New card</h1>
  {{if $d.Error}}<div class="alert alert-error">{{$d.Error}}</div>{{end}}
  <form method="post" action="/cards" class="stack">
    <label class="field">
      <span class="label">Deck *</span>
      <select class="input select" name="deckId" required>
        <option value="">Select a deck…</option>
        {{range $topic := $d.Topics}}
        <optgroup label="{{$topic.Name}}">
          {{range $d.Decks}}{{if eq .TopicID $topic.ID}}
          <option value="{{.ID}}" {{if eq .ID $v.DeckID}}selected{{end}}>{{.Name}}</option>
          {{end}}{{end}}
        </optgroup>
        {{end}}
      </select>
    </label>
    <label class="field">
      <span class="label">Front *</span>
      <textarea class="input" name="front" rows="2" data-autoresize required>{{$v.Front}}</textarea>
    </label>
    <label class="field">
      <span class="label">Back *</span>
      <textarea class="input" name="back" rows="2" data-autoresize required>{{$v.Back}}</textarea>
    </label>
    <label class="field">
      <span class="label">Note</span>
      <textarea class="input" name="note" rows="2" data-autoresize>{{deref $v.Note}}</textarea>
    </label>
    <div class="field">
      <span class="label">Priority *</span>
      <div class="radio-row">
        <label class="radio-pill"><input type="radio" name="priority" value="A" {{if eq $v.Priority "A"}}checked{{end}}><span class="badge badge-a">A</span> High</label>
        <label class="radio-pill"><input type="radio" name="priority" value="B" {{if eq $v.Priority "B"}}checked{{end}}><span class="badge badge-b">B</span> Medium</label>
        <label class="radio-pill"><input type="radio" name="priority" value="C" {{if eq $v.Priority "C"}}checked{{end}}><span class="badge badge-c">C</span> Low</label>
      </div>
    </div>
    <div class="field" data-tag-input>
      <span class="label">Tags <span class="hint">press Enter or comma to add</span></span>
      <div class="tag-chips"></div>
      <input class="input" type="text" data-tag-entry placeholder="Add a tag…">
      <input type="hidden" name="tags" value="{{joinTags $v.Tags}}">
    </div>
    <div class="actions-row">
      <button type="submit" class="btn btn-primary">Create card</button>
      <a class="btn btn-secondary" href="/cards">Cancel</a>
    </div>
  </form>
</div>
{{end}}
