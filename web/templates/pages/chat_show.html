{{define "title"}}Chat: {{.Data.Name}} — Cadence Cards{{end}}
{{define "content"}}
{{$topic := .Data}}
{{/* Back link above the title, not beside it — the reference stacks them. */}}
<div class="chat-page">
  <div class="chat-page-head">
    <a class="back-link" href="/chat">{{template "icon-arrow-left"}}Chat</a>
    <h1 class="h-panel chat-page-title">{{$topic.Name}}</h1>
  </div>

  <div class="chat-page-body">
    <div class="chat-panel chat-full">
      <div class="chat-scroll">
        <div id="chat-messages" class="chat-inner">
          <div class="chat-msg chat-assistant">
            <div class="chat-bubble">Hi! Ask me anything about {{$topic.Name}}.</div>
          </div>
        </div>
      </div>
      <div class="chat-composer">
        <form class="chat-form" hx-post="/chat/{{$topic.ID}}/message"
              hx-target="#chat-messages" hx-swap="beforeend"
              hx-disabled-elt="find button" hx-indicator="#chat-spinner"
              data-chat-form>
          <input type="hidden" id="chat-conversation" name="conversationId" value="0">
          <textarea class="chat-input" name="message" rows="1" placeholder="Ask about {{$topic.Name}}…" data-autoresize required></textarea>
          <button type="submit" class="chat-send" aria-label="Send">{{template "icon-send"}}</button>
          <span id="chat-spinner" class="spinner htmx-indicator" aria-hidden="true"></span>
        </form>
      </div>
    </div>
  </div>
</div>
{{end}}
