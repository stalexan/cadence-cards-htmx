          - nouns
          - food
      - Front: bread
        Back: el pan
        Priority: B
        Tags:
          - nouns
          - food
      - Front: house
        Back: la casa
        Priority: A
        Tags:
          - nouns
      - Front: dog
        Back: el perro
        Note: "**la perra** for a female dog, though it is also an insult — *la perrita* is the safer diminutive."
        Priority: B
        Tags:
          - nouns
          - animals
      - Front: book
        Back: el libro
        Priority: B
        Tags:
          - nouns
      - Front: to speak
        Back: hablar
        Note: One of the three regular verb endings — **-ar** (hablar), **-er** (comer), **-ir** (vivir). Which ending a verb has decides how it conjugates.
        Priority: A
        Tags:
          - verbs
      - Front: to eat
        Back: comer
        Priority: A
        Tags:
          - verbs
      - Front: to live
        Back: vivir
        Priority: B
        Tags:
          - verbs
      - Front: to be (a permanent quality — who or what something is)
        Back: ser
        Note: |-
          Spanish splits "to be" in two.

          **Ser** is for what something fundamentally is: *soy mexicana*, *es
          médico*, *la nieve es blanca*.
        Priority: A
        Tags:
          - verbs
      - Front: to be (a state or a location — how or where something is)
        Back: estar
        Note: |-
          **Estar** is for conditions and places: *estoy cansado* (I'm tired),
          *está en la cocina* (it's in the kitchen).

          The contrast is the whole point: *es aburrido* = he is boring;
          *está aburrido* = he is bored.
        Priority: A
        Tags:
          - verbs
      - Front: today
        Back: hoy
        Priority: B
        Tags:
          - time
      - Front: tomorrow
        Back: mañana
        Note: The same word means "morning" when it takes an article — *mañana* = tomorrow, *la mañana* = the morning. *Mañana por la mañana* is tomorrow morning.
        Priority: A
        Tags:
          - time
      - Front: how much does it cost?
        Back: ¿cuánto cuesta?
        Priority: A
        Tags:
          - phrases
      - Front: where is the bathroom?
        Back: ¿dónde está el baño?
        Note: "**Está**, not *es* — a location, so it takes *estar*."
        Priority: A
        Tags:
          - phrases
      - Front: I don't understand
        Back: no entiendo
        Note: Worth learning before almost anything else. Follow it with *¿puede repetirlo, por favor?* — can you repeat that?
        Priority: A
        Tags:
          - phrases
