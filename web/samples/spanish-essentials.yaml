Topic:
  Name: Spanish Essentials
  TopicDescription: everyday Latin American Spanish for a beginner
  Expertise: patient Spanish tutor
  Focus: vocabulary, gender, and how words are actually used
  ContextType: cultural context
  Example: |-
    H: Why is it "el agua" if agua is feminine?

    A: Good catch — agua really is feminine, and it keeps its feminine
    agreement: *el agua fría*, not *el agua frío*.

    Singular nouns that begin with a stressed "a" sound take **el** instead of
    **la**, purely so the two a-sounds don't run together. The same happens with
    *el águila* (the eagle) and *el hacha* (the axe).

    In the plural the reason disappears and **las** comes back: *las aguas*,
    *las águilas*.
  Question: |-
    Ask for the other side of the card in a natural sentence, so the learner
    recalls the word in context rather than as an isolated item.

    Do not reveal the answer, and do not translate it in the question.
